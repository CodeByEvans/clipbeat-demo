<ion-menu side="end" menuId="profile-menu" contentId="main-content">
  <ion-header class="ion-no-border">
    <ion-toolbar>
      <ion-title class="menu-title">Ajustes</ion-title>
      <ion-buttons slot="end">
        <ion-button (click)="closeSidebar()" class="close-menu-button"
          >✕</ion-button
        >
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content class="menu-content">
    <!-- Sección Cuenta -->
    <ion-list lines="none" class="menu-section-list">
      <div class="section-title">Cuenta</div>
      <section class="section-card">
        <ion-item button class="menu-item" (click)="goTo('privacidad')">
          <ion-icon
            name="lock-closed-outline"
            slot="start"
            class="menu-item-icon"
          ></ion-icon>
          <ion-label>Privacidad</ion-label>
        </ion-item>

        <ion-item button class="menu-item" (click)="goTo('seguridad')">
          <ion-icon
            name="shield-checkmark-outline"
            slot="start"
            class="menu-item-icon"
          ></ion-icon>
          <ion-label>Seguridad</ion-label>
        </ion-item>

        <ion-item
          button
          class="menu-item danger"
          (click)="goTo('eliminarCuenta')"
        >
          <ion-icon
            name="trash-outline"
            slot="start"
            class="menu-item-icon danger"
          ></ion-icon>
          <ion-label color="danger">Eliminar cuenta</ion-label>
        </ion-item>
      </section>
    </ion-list>

    <div class="menu-spacer" style="flex: 1 1 auto"></div>

    <ion-list lines="none" class="logout-list">
      <section class="section-card">
        <ion-item button class="menu-item" (click)="logout()">
          <ion-icon
            name="log-out-outline"
            slot="start"
            class="menu-item-icon"
          ></ion-icon>
          <ion-label>Cerrar sesión</ion-label>
        </ion-item>
      </section>
    </ion-list>
  </ion-content>
</ion-menu>

<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button
        defaultHref="/home"
        icon="chevron-back-outline"
        text="Atrás"
      ></ion-back-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button class="header-end-button" (click)="shareProfile()">
        <ion-icon name="share-outline"></ion-icon>
      </ion-button>
      <ion-button class="header-end-button" (click)="toggleSidebar()">
        <ion-icon name="reorder-three-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content
  *ngIf="!loading; else loadingTemplate"
  [fullscreen]="true"
  class="profile-page"
>
  <div class="profile-container ion-padding ion-text-center">
    <!-- Foto de perfil -->
    <div class="profile-photo">
      <img [src]="profilePhoto" alt="Foto de perfil" />
    </div>

    <!-- Username container -->
    <div class="username-container" style="margin-top: 8px">
      <h2 class="username">{{ displayName }}</h2>
      <ion-button
        size="small"
        class="create-button"
        [routerLink]="['edit-profile']"
      >
        <ion-icon name="create"></ion-icon>
      </ion-button>
    </div>

    <!-- Username secundario y lugar -->
    <p class="sub-info">@{{ username }} · {{ location }}</p>

    <!-- Rating -->
    <div class="rating">
      <ion-icon
        *ngFor="let star of stars; let i = index"
        [name]="i < rating ? 'star' : 'star-outline'"
      ></ion-icon>
      <p>({{reviews}})</p>
    </div>

    <p class="bio">{{biography}}</p>

    <div class="links">
      <a
        *ngFor="let link of socialLinks"
        [href]="link.url"
        target="_blank"
        class="social-link"
      >
        <ion-icon [name]="link.icon">{{ link.name }}</ion-icon>
      </a>
    </div>
  </div>

  <!-- Grid de publicaciones estilo perfil TikTok con botones -->
  <div class="posts-grid ion-padding">
    <div *ngFor="let post of posts" class="grid-card">
      <img [src]="post.img" [alt]="post.title" />

      <div class="grid-overlay">
        <ion-button fill="clear" size="small">
          <ion-icon name="heart-outline"></ion-icon>
          {{ post.likes }}
        </ion-button>
        <ion-button fill="clear" size="small">
          <ion-icon name="chatbubble-outline"></ion-icon>
          {{ post.comments }}
        </ion-button>
        <ion-button fill="clear" size="small">
          <ion-icon name="share-outline"></ion-icon>
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>

<ng-template #loadingTemplate>
  <ion-content class="ion-padding ion-text-center">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando perfil...</p>
  </ion-content>
</ng-template>
